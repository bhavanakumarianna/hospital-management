spring.application.name=hospital-management

# Local secrets (DB_PASSWORD, ADMIN_PASSWORD) live in the git-ignored .env file
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Allow optional number fields (age, fee...) to be left out of JSON requests
spring.jackson.deserialization.fail-on-null-for-primitives=false

# First admin login, created on startup if no admin exists yet
app.admin.email=${ADMIN_EMAIL:admin@carepoint.com}
app.admin.password=${ADMIN_PASSWORD:}

# Session cookie: not readable by JavaScript, not sent by other sites
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
