spring.application.name=hospital-management

# Tests use an in-memory H2 database, so MySQL is not needed
spring.datasource.url=jdbc:h2:mem:hospital_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false


# Allow optional number fields (age, fee...) to be left out of JSON requests
spring.jackson.deserialization.fail-on-null-for-primitives=false
